{% extends 'base.html' %}

{% block content %}

<h1>Delete Application</h1>

<p>
    Are you sure you want to delete
    <strong>{{ application.company }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<a href="{% url 'home' %}">Cancel</a>

{% endblock %}
